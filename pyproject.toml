[project]
name = "hunterx"
version = "0.1.0"
description = "CLI tool for scraping job descriptions and optimizing resumes with Kimi"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0,<1.0",
    "anthropic>=0.80.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "ruff>=0.4.0",
]

[project.scripts]
hunterx = "hunterx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunterx"]

[tool.ruff]
target-version = "py311"
line-length = 100
